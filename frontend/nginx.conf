# SyncDance web: landing + admin panel (Angular) and the single entry to Django.

# Behind Caddy (production) keep the scheme the browser used, so Django knows
# the request was HTTPS; alone (development) it is this server's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # APK uploads from the panel (the API caps them at 250 MB).
    client_max_body_size 260m;

    # Docker DNS, re-resolved: a restarted backend keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://backend:8000;

    # Django: API, its admin (instructors) and the admin's static files.
    # /media/ is deliberately not exposed: files go through permission-checked
    # API endpoints (the APK through /api/app/download/).
    location ~ ^/(api|admin|static)/ {
        proxy_pass $django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # nginx receives the whole upload first, so a slow phone never holds
        # one of gunicorn's few workers for minutes.
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed bundles and fonts never change: cache them for a year.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell is always revalidated so a deploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
